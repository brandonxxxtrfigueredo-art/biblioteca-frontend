<div class="auth-container">
  <div class="auth-card">
    <h2>{{ esRegistro() ? 'Crear Cuenta de Lector' : 'Iniciar Sesión' }}</h2>
    @if (error()) { <div class="alert-error">{{ error() }}</div> }

    <form (ngSubmit)="enviar()">
      @if (esRegistro()) {
        <div class="form-group">
          <label>Nombre completo</label>
          <input type="text" [(ngModel)]="nombre" name="nombre" required minlength="2">
        </div>
      }
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" [(ngModel)]="correo" name="correo" required>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="password" name="password" required minlength="6">
      </div>
      <button type="submit" class="btn-submit" [disabled]="cargando()">
        {{ cargando() ? 'Procesando...' : (esRegistro() ? 'Registrarme' : 'Entrar') }}
      </button>
    </form>

    <p class="toggle-text">
      {{ esRegistro() ? '¿Ya tienes cuenta?' : '¿No tienes cuenta?' }}
      <button type="button" class="btn-link" (click)="esRegistro.set(!esRegistro()); error.set('')">
        {{ esRegistro() ? 'Inicia sesión' : 'Regístrate aquí' }}
      </button>
    </p>

    <div class="demo-creds">
      <small>Accesos rápidos:</small>
      <div class="demo-btns">
        <button type="button" (click)="autocompletar('admin@biblioteca.com', 'admin123')">Admin</button>
        <button type="button" (click)="autocompletar('lector@biblioteca.com', 'lector123')">Lector</button>
      </div>
    </div>
  </div>
</div>
